name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0
  RELEASE_TAG: v${{ inputs.version }}

# Serialize attempts for a version so a queued duplicate observes the tag or
# release created by the first run before it reaches publication.
concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Validate release request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version=$(cargo pkgid | sed 's/.*#//')
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main, not ${GITHUB_REF}." >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Requested ${RELEASE_TAG}, but Cargo.toml contains ${package_version}." >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to move it." >&2
            exit 1
          fi

      - name: Validate
        run: ./scripts/validate

      - name: Build archive and checksum
        run: ./scripts/package x86_64-unknown-linux-gnu

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btui-linux-x86-64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create tag and publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: btui ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          working_directory: dist
          files: |
            *.tar.gz
            *.tar.gz.sha256
