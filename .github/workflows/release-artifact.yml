name: Build release artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          package_version=$(cargo pkgid | sed 's/.*#//')
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Validate
        run: ./scripts/validate

      - name: Build archive and checksum
        run: ./scripts/package x86_64-unknown-linux-gnu

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btui-linux-x86-64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
