[package]
name = "beads-tui"
version = "0.4.4-rc.1"
edition = "2024"
rust-version = "1.88"
description = "A human-friendly terminal browser and work-session launcher for Beads"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AndreasDellrud/beads-tui"
homepage = "https://github.com/AndreasDellrud/beads-tui"
keywords = ["beads", "cli", "ratatui", "terminal", "tui"]
categories = ["command-line-utilities"]
exclude = ["/.beads/", "/.github/", "/dist/", "/target/"]

[[bin]]
name = "btui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.27"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
